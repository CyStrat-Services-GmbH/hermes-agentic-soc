[project]
name = "hermes-agentic-soc"
version = "0.2.0"
description = "Evidence-first Hermes SOC plugin"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "jsonschema>=4.18,<5", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
include = ["agentic_soc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
